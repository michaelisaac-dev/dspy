mail\", \"emails\", \"paid\", \"he\", \"she\", \"they\", \"it\", \"his\", \"her\",\n            \"their\", \"use\", \"please\", \"thank\", \"authorized\", \"authority\", \"sent\",\n            \"receiving\", \"learn\", \"text\", \"who\", \"which\", \"that\", \"with\", \"by\",\n            \"from\", \"no\", \"any\", \"candidate\", \"candidates\", \"candidate's\",\n            \"box\", \"suite\", \"ste\", \"street\", \"ave\", \"avenue\", \"road\", \"rd\", \"blvd\",\n            \"drive\", \"dr.\", \"washington\", \"donate\", \"view\", \"manage\", \"here\",\n        }\n        # Words that reveal we have entered a postal-address block. A number followed\n        # (within a few tokens) by one of these is a street address, not part of a name.\n        ADDRESS_HINTS = {\n            \"street\", \"st\", \"st.\", \"ave\", \"ave.\", \"avenue\", \"road\", \"rd\", \"rd.\",\n            \"blvd\", \"blvd.\", \"boulevard\", \"drive\", \"dr\", \"dr.\", \"lane\", \"ln\", \"way\",\n            \"suite\", \"ste\", \"ste.\", \"box\", \"pobox\", \"po\", \"p.o.\", \"p.o\", \"floor\",\n            \"fl\", \"apt\", \"unit\", \"circle\", \"court\", \"ct\", \"place\", \"pl\", \"pkwy\",\n            \"parkway\", \"highway\", \"hwy\", \"terrace\", \"trail\", \"square\", \"sq\",\n            \"building\", \"bldg\", \"room\", \"rm\", \"nw\", \"ne\", \"sw\", \"se\", \"north\",\n            \"south\", \"east\", \"west\", \"suite,\",\n        }\n        COMMITTEE_WORDS = (\"pac\", \"fund\", \"committee\", \"gop\", \"inc\", \"action\",\n                           \"project\", \"party\", \"victory\", \"alliance\", \"coalition\",\n                           \"network\", \"majority\", \"caucus\", \"campaign\", \"trust\")\n        PUNCT = \".,;:()[]{}\\\"'*|<>!?_-\u2013\u2014\u2026\u2022\"\n        URL_RE = re.compile(r'(www\\.|https?://|mailto:|\\.com|\\.org|\\.net|\\.us|\\.gov)', re.IGNORECASE)\n        DOMAIN_ONLY_RE = re.compile(\n            r'^[A-Za-z0-9][A-Za-z0-9\\-]*\\.(com|org|net|us|gov|io| n whose tail is a known committee word\n            (e.g. a state name fused to 'REPUBLICAN').\"\"\"\n            if len(word) < 11 or any(c.islower() for c in word) or not word.isalpha():\n                return [word]\n            parts = []\n            cur = word\n            for _ in range(4):\n                found = None\n                for i in range(3, len(cur) - 2):\n                    if cur[i:] in KNOWN_UPPER:\n                        found = i\n                        break\n                if found is None:\n                    break\n                parts.insert(0, cur[found:])\n                cur = cur[:found]\n            parts.insert(0, cur)\n            return [p for p in parts if p]\n\n        def split_connector(tok: str) -> list:\n            \"\"\"Split a capitalized word fused to an adjacent connector word\n            ('Friendsof' -> 'Friends', 'of'), a common line-break artifact.\"\"\"\n            m = re.match(r'^([A-Z][a-z]{2,})(of|for|and|the|to)$', tok)\n            if m:\n                return [m.group(1), m.group(2)]\n            m = re.match(r'^([A-Z]{4,})(OF|FOR|AND|THE|TO)$', tok)\n            if m:\n                return [m.group(1), m.group(2)]\n            return [tok]\n\n        def is_caps_like(core: str) -> bool:\n            \"\"\"True when the token has no lowercase letters (or no letters at all).\"\"\"\n            return not any(c.islower() for c in core)\n\n        def address_ahead(toks: list, i: int) -> bool:\n            \"\"\"True when an address keyword (Street, Suite, Box, ...) or a ZIP-like\n            number appears within the next few tokens, meaning the number at position\n            i starts a postal address rather than continuing a committee name.\"\"\"\n            for t in toks[i + 1: i + 4]:\n                c = t.strip(PUNCT).lower()\n                if not c:\n                    continue\n                if c in ADDRESS_HINTS:\n                    return True\n                if re.match(r'^\\d{5}(-\\d{4})?$', c):\n                    return True\n            return False\n\n        def harvest(after: str) -> list:\n            \"\"\"Read the committee-name tokens out of the text following a disclaimer phrase.\"\"\"\n            toks = after.split()[:40]\n            out = []\n            first_caps = None\n            pending_comma = False\n            for i, t in enumerate(toks):\n                core = t.strip(PUNCT)\n                if not core:\n                    if out:\n                        break\n                    continue\n                low = core.lower()\n                if low in HARD_STOP:\n                    break\n                if \"@\" in core:\n                    break\n                # A parenthetical / bracketed annotation after the name (typically the\n                # committee's website) is NOT part of the legal name: stop here.\n                if out and (t.startswith(\"(\") or t.startswith(\"[\")):\n                    break\n                # A bare web domain token ('example.com'): stop, and keep NOTHING from it \u2014\n                # the domain label is not part of the committee name.\n                if DOMAIN_ONLY_RE.match(core):\n                    break\n                um = URL_RE.search(core)\n                if um:\n                    # a URL glued to (or standing after) the name: keep any clean\n                    # non-domain prefix, then stop.\n                    prefix = core[:um.start()].strip(PUNCT)\n                    if prefix and len(prefix) > 1 and not prefix.islower():\n                        for piece in split_glued(prefix):\n                            out.extend(split_connector(piece))\n                    break\n                if re.match(r'^\\d', core):\n                    # Committee names frequently contain a short number standing in for\n                    # 'for' or a cycle year ('<Name> 4 <State>', '<Name> 2024'). Keep such\n                    # a number when it is embedded in the name and clearly not a street\n                    # number / ZIP.\n                    nxt = toks[i + 1].strip(PUNCT) if i + 1 < len(toks) else \"\"\n                    keep_number = (\n                        bool(out)\n                        and not pending_comma\n                        and re.match(r'^\\d{1,4}$', core) is not None\n                        and bool(nxt)\n                        and nxt[:1].isalpha()\n                        and nxt[:1].isupper()\n                        and nxt.lower() not in HARD_STOP\n                        and nxt.lower() not in ADDRESS_HINTS\n                        and not address_ahead(toks, i)\n                    )\n                    if keep_number:\n                        out.append(core)\n                        pending_comma = \",\" in t\n                        if len(out) >= 14:\n                            break\n                        continue\n                    break\n                if out and pending_comma and core[:1].islower():\n                    break\n                abbrev_like = (low in ABBREV) or (len(core) <= 2 and core.isupper() and core.isalpha())\n                if out:\n                    if first_caps and not is_caps_like(core) and low not in CONNECTORS:\n                        break\n                    if (not first_caps) and core.islower() and low not in CONNECTORS:\n                        break\n                else:\n                    first_caps = is_caps_like(core) and any(c.isalpha() for c in core) and len(core) > 1\n                added = []\n                for piece in split_glued(core):\n                    added.extend(split_connector(piece))\n                out.extend(added)\n                if abbrev_like and \".\" in t:\n                    out[-1] = out[-1] + \".\"\n                if len(out) >= 14:\n                    break\n                trailing = t[len(t.rstrip(PUNCT)):] if t.rstrip(PUNCT) != t else \"\"\n                if any(ch in trailing for ch in \";|\") or \"\u2014\" in trailing or \"\u2013\" in trailing:\n                    break\n                if \".\" in trailing and not abbrev_like:\n                    break\n                pending_comma = \",\" in trailing\n            return out\n\n        def key_of(tok: str) -> str:\n            return re.sub(r'[^a-z0-9]', '', tok.lower())\n\n        def dedupe(tokens: list) -> list:\n            \"\"\"Cut repetition. Two things happen right after a disclaimer:\n            (a) the whole committee name is repeated as the first line of the postal\n                address block, and\n            (b) the FOLLOWING sentence starts with the candidate's name, which is also\n                the tail of the committee name ('Friends of X Y' + 'X Y is running...'),\n                producing a repeated SUFFIX rather than a repeated whole name.\"\"\"\n            keys = [key_of(t) for t in tokens]\n            # (a) whole-name doubling\n            for k in range(1, len(tokens)):\n                head = \"\".join(keys[:k])\n                rest = \"\".join(keys[k:])\n                if len(head) < 6 or not rest:\n                    continue\n                if rest.startswith(head) or (len(rest) >= 6 and head.startswith(rest)):\n                    tokens = tokens[:k]\n                    keys = keys[:k]\n                    break\n            # (b) repeated trailing block of tokens\n            for _ in range(4):\n                n = len(tokens)\n                cut = None\n                for m in range(min(6, n // 2), 0, -1):\n                    tail = keys[n - m:]\n                    prev = keys[n - 2 * m: n - m]\n                    if tail == prev and sum(len(x) for x in tail) >= 5:\n                        cut = m\n                        break\n                if cut is None:\n                    break\n                tokens = tokens[:n - cut]\n                keys = keys[:n - cut]\n            return tokens\n\n        def trim_edges(tokens: list) -> list:\n            \"\"\"Drop leading/trailing connector words ('the', 'of', 'and', ...) and any\n            trailing bare number left dangling at the end of the name.\"\"\"\n            while tokens and key_of(tokens[0]) in CONNECTORS:\n                tokens = tokens[1:]\n            while tokens and (key_of(tokens[-1]) in CONNECTORS\n                              or re.match(r'^\\d{1,4}$', tokens[-1].strip(PUNCT) or \"x\")):\n                tokens = tokens[:-1]\n            return tokens\n\n        def title_all(name: str) -> str:\n            \"\"\"Title-case a name, keeping acronyms uppercase and small words lowercase.\"\"\"\n            words = name.split()\n            res = []\n            for i, w in enumerate(words):\n                base = w.strip(PUNCT)\n                if base and base.upper() in KEEP_UPPER:\n                    res.append(w.upper())\n                elif len(base) <= 1:\n                    res.append(w)\n                elif i > 0 and base.lower() in SMALL:\n                    res.append(w.lower())\n                else:\n                    res.append(\"-\".join((p[:1].upper() + p[1:].lower()) if p else p\n                                        for p in w.split(\"-\")))\n            return \" \".join(res)\n\n        def smart_case(name: str) -> str:\n            \"\"\"Keep the disclaimer's own capitalization (ALL-CAPS disclaimers are reported\n            in ALL CAPS, as legally written); only repair an all-lowercase name.\"\"\"\n            if not name:\n                return name\n            if not any(c.isupper() for c in name):\n                name = title_all(name)\n            if name and name[0].isalpha():\n                name = name[0].upper() + name[1:]\n            return name\n\n        def suspicious(name: str, tokens: list) -> bool:\n            \"\"\"True when the deterministic extraction cannot be trusted; caller then\n            defers to a weaker heuristic or the LLM instead of guessing. A confident\n            wrong answer scores zero, so bail out whenever the shape looks off.\"\"\"\n            if not name or not tokens:\n                return True\n            letters = sum(1 for c in name if c.isalpha())\n            if letters < 3:\n                return True\n            if len(tokens) > 10:\n                return True\n            if URL_RE.search(name) or \"@\" in name:\n                return True\n            if key_of(name) in HARD_STOP:\n                return True\n            if len(tokens) == 1 and tokens[0].islower():\n                return True\n            # A single-word result is almost never a full committee name (usually the\n            # parser stopped early, e.g. at a digit or punctuation). Only trust it when\n            # the word itself is committee-like.\n            if len(tokens) == 1:\n                k = key_of(tokens[0])\n                if not any(w in k for w in COMMITTEE_WORDS):\n                    return True\n            keys = [key_of(t) for t in tokens]\n            joined = \"\".join(keys)\n            # residual whole-name doubling (e.g. \"X Y X Y\")\n            for k in range(1, len(tokens)):\n                head = \"\".join(keys[:k])\n                if len(head) >= 6 and \"\".join(keys[k:]).startswith(head):\n                    return True\n            # residual repeated trailing block (e.g. \"Friends of X Y X Y\")\n            n = len(tokens)\n            for m in range(1, min(6, n // 2) + 1):\n                if keys[n - 2 * m: n - m] == keys[n - m:] and sum(len(x) for x in keys[n - m:]) >= 5:\n                    return True\n            if len(joined) > 90:\n                return True\n            return False\n\n        text = unglue(norm_ws(body))\n\n        def compact_index(t: str):\n            \"\"\"Return (whitespace-free lowercase copy, map from compact index -> index in t).\n            Lets us match disclaimer phrases even when the email's stripped line breaks\n            glued the words together ('autho const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
