<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": 0.9, "parents": "seed", "role": "Seed", "components": {"self::code": "class IdentifyCommitteeModule(dspy.Module):\n    def __init__(self):\n        super().__init__()\n        self.predict = dspy.Predict(dspy.Signature('email_body: str -> committee: str', 'Identify the political committee that sponsored a fundraising email.'))\n\n    def forward(self, **inputs):\n        result = self.predict(**inputs)\n        return dspy.Prediction(committee=result.committee)"}},
{"idx": 1, "score": 1.0, "parents": "0", "role": "Best", "components": {"self::code": "class IdentifyCommitteeModule(dspy.Module):\n    def __init__(self):\n        super().__init__()\n        self.identify = dspy.ChainOfThought(dspy.Signature(\n            \"email_body: str, disclaimer_snippets: str -> committee: str\",\n            \"You identify the political committee that SPONSORED (paid for) a fundraising email.\\n\"\n            \"\\n\"\n            \"DOMAIN KNOWLEDGE:\\n\"\n            \"- U.S. campaign-finance law requires a disclaimer in political fundraising email, usually of the \"\n            \"form 'Paid for by <COMMITTEE NAME>' (sometimes 'Paid for by the <COMMITTEE>', \"\n            \"'Contributions to <COMMITTEE> are not tax deductible', or a footer address block).\\n\"\n            \"- The `disclaimer_snippets` field contains the text found around those phrases in the email. \"\n            \"Treat it as the primary evidence; use `email_body` only for context/disambiguation.\\n\"\n            \"- The committee is an organization (a candidate committee like '<Name> for Senate', a joint \"\n            \"fundraising committee, a PAC, or a party committee), never a person, never a donation platform \"\n            \"(ActBlue, WinRed, Anedot, etc.), never an email vendor, and never a list-renting newsletter whose \"\n            \"unsubscribe/address block appears at the very bottom. When several organizations appear, the \"\n            \"sponsor is the one named in the 'Paid for by' line.\\n\"\n            \"\\n\"\n            \"OUTPUT RULES (follow exactly):\\n\"\n            \"1. Output ONLY the committee's name \u2014 no quotes, no explanation, no 'Paid for by' prefix, no address.\\n\"\n            \"2. Reproduce the name as the disclaimer writes it. If the disclaimer uses an acronym/initialism \"\n            \"(e.g. an all-caps set of letters), output ONLY that acronym \u2014 do NOT expand it and do NOT append a \"\n            \"parenthetical expansion. If the disclaimer spells out the full name, output the full name and do NOT \"\n            \"append an acronym in parentheses. Never output a form like 'Full Name (ACRONYM)'.\\n\"\n            \"3. Drop the leading article 'the'.\\n\"\n            \"4. Drop any trailing descriptive clause, e.g. ', a joint fundraising committee authorized by and \"\n            \"composed of ...', ', and not authorized by any candidate or candidate's committee', mailing \"\n            \"addresses, or 'Inc.'-style boilerplate that is not part of the name.\\n\"\n            \"5. If the disclaimer is written in ALL CAPS, normalize to conventional capitalization of that same \"\n            \"name (capitalize principal words, keep small words like 'for', 'of', 'and' lowercase).\\n\"\n            \"6. If no explicit disclaimer exists, infer the committee from the sending domain, unsubscribe links, \"\n            \"or footer, and give its committee name in the same minimal form.\\n\"\n        ))\n\n    def forward(self, **inputs):\n        import re\n\n        body = str(inputs.get(\"email_body\") or \"\")\n\n        def find_disclaimers(text: str) -> list:\n            \"\"\"Collect short snippets of text around campaign-finance disclaimer phrases.\"\"\"\n            patterns = [\n                r\"paid for by\",\n                r\"contributions? to\",\n                r\"authorized by\",\n                r\"receiving this email because\",\n                r\"future emails from\",\n                r\"emails from\",\n            ]\n            found = []\n            for pat in patterns:\n                for m in re.finditer(pat, text, flags=re.IGNORECASE):\n                    found.append(text[m.start(): m.start() + 220].strip())\n            seen = set()\n            out = []\n            for s in found:\n                key = re.sub(r\"\\s+\", \" \", s.lower())\n                if key not in seen:\n                    seen.add(key)\n                    out.append(re.sub(r\"\\s+\", \" \", s))\n            return out[:8]\n\n        def paid_for_text(snippets: list) -> str:\n            \"\"\"Concatenate just the 'paid for by' style snippets (strongest evidence).\"\"\"\n            strong = [s for s in snippets if re.match(r\"(?i)^(paid for by|contributions? to)\", s)]\n            return \" \".join(strong) if strong else \" \".join(snippets)\n\n        def clean(name: str, evidence: str) -> str:\n            \"\"\"Normalize the predicted committee name: strip prefixes, articles, trailing clauses,\n            and collapse 'Full Name (ACRONYM)' to whichever form the disclaimer actually used.\"\"\"\n            n = re.sub(r\"\\s+\", \" \", str(name or \"\")).strip()\n            n = n.strip('\"\\u201c\\u201d\\'')\n            n = re.sub(r\"(?i)^paid for by\\s+\", \"\", n).strip()\n            n = re.sub(r\"(?i)^committee[:\\s]+\", \"\", n).strip()\n\n            m = re.match(r\"^(.*?)\\s*[\\(\\[]([^\\)\\]]+)[\\)\\]]\\s*$\", n)\n            if m:\n                outer, inner = m.group(1).strip(), m.group(2).strip()\n                ev = evidence.lower()\n                outer_hit = bool(outer) and outer.lower() in ev\n                inner_hit = bool(inner) and inner.lower() in ev\n                if inner_hit and not outer_hit:\n                    n = inner\n                elif outer_hit and not inner_hit:\n                    n = outer\n                elif inner_hit and inner_hit == outer_hit:\n                    # both appear; prefer the form used right after \"paid for by\"\n                    pf = re.search(r\"(?i)paid for by(?:\\s+the)?\\s+(.{0,80})\", evidence)\n                    tail = pf.group(1).lower() if pf else ev\n                    n = inner if tail.strip().startswith(inner.lower()) else outer\n                else:\n                    n = outer or inner\n\n            # remove trailing descriptive clauses\n            n = re.split(\n                r\"(?i),\\s*(?:a\\s|an\\s|the\\s)?(?:joint fundraising|authorized|and not authorized|\"\n                r\"a project of|which is|not authorized)\",\n                n,\n            )[0]\n            n = re.sub(r\"(?i)\\s+and not authorized by.*$\", \"\", n)\n            n = re.sub(r\"(?i)^the\\s+\", \"\", n).strip()\n            n = n.strip(\" .,;:-\\u2013\\u2014\")\n            n = re.sub(r\"\\s+\", \" \", n)\n            return n\n\n        snippets = find_disclaimers(body)\n        hint = \"\\n---\\n\".join(snippets) if snippets else \"(no disclaimer phrase found)\"\n        evidence = paid_for_text(snippets) if snippets else body\n\n        out = self.identify(email_body=body[:20000], disclaimer_snippets=hint)\n        committee = clean(getattr(out, \"committee\", \"\"), evidence)\n\n        if not committee:\n            committee = str(getattr(out, \"committee\", \"\") or \"\").strip()\n\n        return dspy.Prediction(committee=str(committee))"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.90)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(1.00)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
