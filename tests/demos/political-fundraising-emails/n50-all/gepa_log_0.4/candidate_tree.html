{"idx": 1, "score": 0.605, "parents": "0", "role": "", "components": {"self::code": "class IdentifyCommitteeModule(dspy.Module):\n    def __init__(self):\n        super().__init__()\n        # LLM is used ONLY as a last resort, when the deterministic parser cannot\n        # find a usable \"Paid for by ...\" disclaimer in the email text.\n        self.fallback = dspy.Predict(dspy.Signature(\n            \"email_body: str -> committee: str\",\n            \"You are given the plain-text body of a political fundraising email. Name the political \"\n            \"committee (the FEC-registered organization) that sponsored and paid for the email.\\n\"\n            \"Where to look: the legally required disclaimer, usually near the end of the email, in the form \"\n            \"'Paid for by <COMMITTEE>' or 'Paid for by <COMMITTEE>. Not authorized by any candidate or \"\n            \"candidate's committee.' The footer mailing-address block usually repeats the same committee \"\n            \"name immediately above the street address, and lines like 'Contributions to <COMMITTEE> are \"\n            \"not deductible' also name it.\\n\"\n            \"Rules:\\n\"\n            \"- Reproduce the committee name exactly as written in the disclaimer, including a leading 'The' \"\n            \"if present, and keeping every part of the name (e.g. 'for Congress', 'for Senate', 'Victory \"\n            \"Fund', 'PAC', 'Democratic Party').\\n\"\n            \"- Never include the phrase 'Paid for by', the phrase 'not authorized by any candidate', a \"\n            \"street address, PO Box, city/state/ZIP, phone number, URL, domain name, or unsubscribe text.\\n\"\n            \"- If the disclaimer is written in ALL CAPS, convert it to ordinary title case.\\n\"\n            \"- If words are run together because line breaks were stripped (e.g. a first and last name \"\n            \"fused), restore the missing spaces.\\n\"\n            \"- Do not answer with a candidate's bare personal name unless that is literally the committee \"\n            \"name in the disclaimer.\\n\"\n            \"- Output ONLY the committee name: no quotes, no trailing punctuation, no explanation.\"\n        ))\n\n    def forward(self, **inputs):\n        import re\n\n        body = inputs.get(\"email_body\") or \"\"\n\n        # ---------- helpers ----------\n        def normalize_ws(t: str) -> str:\n            \"\"\"Collapse all whitespace/invisible padding characters into single spaces.\"\"\"\n            for ch in (\"\\u034f\", \"\\u200b\", \"\\u200c\", \"\\u200d\", \"\\ufeff\", \"\\xa0\", \"\\u00ad\"):\n                t = t.replace(ch, \" \")\n            return re.sub(r\"\\s+\", \" \", t).strip()\n\n        def dewrap(t: str) -> str:\n            \"\"\"Insert spaces where line-wrapping fused two words (lowercase followed by uppercase),\n            skipping legitimate name prefixes like Mc/Mac/De/O'.\"\"\"\n            prefixes = {\"mc\", \"mac\", \"de\", \"del\", \"della\", \"di\", \"da\", \"la\", \"le\",\n                        \"van\", \"von\", \"du\", \"o\", \"d\", \"st\", \"des\", \"dos\"}\n            out = []\n            for i, ch in enumerate(t):\n                if i > 0 and ch.isupper() and t[i - 1].islower():\n                    j = i - 1\n                    while j >= 0 and (t[j].isalpha() or t[j] == \"'\"):\n                        j -= 1\n                    word = t[j + 1:i]\n                    if word.lower() not in prefixes:\n                        out.append(\" \")\n                out.append(ch)\n            return \"\".join(out)\n\n        stop_patterns = [\n            r\"(?i)\\b(?:and\\s+)?(?:is\\s+)?not\\s+authoriz\",\n            r\"(?i)\\bauthorized\\s+by\\b\",\n            r\"(?i)\\bnot\\s+paid\\s+for\\b\",\n            r\"(?i)\\bunsubscrib\",\n            r\"(?i)\\bcontribution\",\n            r\"(?i)\\bdonations?\\b\",\n            r\"(?i)\\bp\\.?\\s?o\\.?\\s*box\\b\",\n            r\"(?i)\\ball\\s+rights\\s+reserved\\b\",\n            r\"(?i)\\bcopyright\\b\",\n            r\"(?i)\\btreasurer\\b\",\n            r\"(?i)https?://\",\n            r\"(?i)\\bwww\\.\",\n            r\"(?i)[A-Za-z0-9\\-]+\\.(?:com|org|net|us|io|gov|co)\\b\",\n            r\"(?i)\\bif\\s+you\\b\",\n            r\"(?i)\\bthis\\s+(?:e-?mail|message)\\b\",\n            r\"(?i)\\bfederal\\s+law\\b\",\n            r\"(?i)\\bpaid\\s+for\\s+by\\b\",\n            r\"(?i)\\btext\\s+[A-Z]+\\s+to\\b\",\n            r\"\\d\",\n            r\"\u00a9\",\n            r\"\\|\",\n            r\"\\(\",\n            r\"\\[\",\n        ]\n\n        abbrevs = {\"inc\", \"llc\", \"jr\", \"sr\", \"dr\", \"mr\", \"mrs\", \"ms\", \"st\", \"no\", \"dept\"}\n\n        def first_stop(tail: str) -> int:\n            best = len(tail)\n            for pat in stop_patterns:\n                m = re.search(pat, tail)\n                if m and m.start() < best:\n                    best = m.start()\n            # sentence-ending period (but not an abbreviation or an initial)\n            for m in re.finditer(r\"\\.(?=\\s|$)\", tail):\n                w = re.search(r\"[A-Za-z]+$\", tail[:m.start()])\n                if w and len(w.group(0)) >= 3 and w.group(0).lower() not in abbrevs:\n                    if m.start() < best:\n                        best = m.start()\n                    break\n            return best\n\n        def clean(s: str) -> str:\n            s = s.strip()\n            s = s.strip(\"\\\"'\u201c\u201d\u2018\u2019*|-\u2013\u2014\u2022\u00b7:;,. \\t\")\n            s = re.sub(r\"(?i)[\\s,]+(and|the|by|for|of|a)$\", \"\", s)\n            return normalize_ws(s)\n\n        def dedupe(tokens):\n            \"\"\"Collapse an immediately repeated name ('X Y X Y' -> 'X Y').\"\"\"\n            key = [re.sub(r\"[^a-z0-9]\", \"\", t.lower()) for t in tokens]\n            n = len(tokens)\n            for k in range(1, n // 2 + 1):\n                if key[:k] == key[k:2 * k]:\n                    return tokens[:k]\n            return tokens\n\n        def fix_caps(s: str) -> str:\n            letters = [c for c in s if c.isalpha()]\n            if not letters or not all(c.isupper() for c in letters) or len(letters) <= 3:\n                return s\n            small = {\"for\", \"of\", \"and\", \"the\", \"a\", \"an\", \"to\", \"in\", \"on\", \"at\", \"our\"}\n            keep_upper = {\"PAC\", \"GOP\", \"US\", \"USA\", \"SCF\", \"NRSC\", \"DSCC\", \"NRCC\", \"DCCC\",\n                          \"II\", \"III\", \"IV\", \"DC\", \"NY\", \"PA\", \"TX\", \"CA\"}\n            out = []\n            for idx, w in enumerate(s.split(\" \")):\n                core = w.strip(\".,'\\\"\")\n                if core.upper() in keep_upper:\n                    out.append(w.upper())\n                elif core.lower() in small and idx > 0:\n                    out.append(w.lower())\n                else:\n                    out.append(re.sub(r\"[A-Za-z]+\", lambda m: m.group(0).capitalize(), w))\n            return \" \".join(out)\n\n        def finish(raw: str) -> str:\n            cand = clean(raw)\n            cand = dewrap(cand)\n            cand = normalize_ws(cand)\n            tokens = [t for t in cand.split(\" \") if t]\n            tokens = dedupe(tokens)\n            cand = clean(\" \".join(tokens))\n            return fix_caps(cand)\n\n        def plausible(cand: str) -> bool:\n            if not cand:\n                return False\n            toks = cand.split(\" \")\n            if len(toks) > 12 or len(cand) > 95 or len(cand) < 3:\n                return False\n            return any(c.isalpha() for c in cand)\n\n        # ---------- deterministic extraction ----------\n        text = normalize_ws(body)\n        candidates = []\n\n        for m in re.finditer(r\"(?i)\\bpaid\\s+for\\s+by\\b\\s*:?\\s*\", text):\n            tail = text[m.end():m.end() + 400]\n            piece = tail[:first_stop(tail)]\n            cand = finish(piece)\n            if plausible(cand):\n                candidates.append(cand)\ {"idx": 2, "score": 0.805, "parents": "1", "role": "", "components": {"self::code": "class IdentifyCommitteeModule(dspy.Module):\n    def __init__(self):\n        super().__init__()\n        # The LM is used ONLY when the deterministic parser cannot recover a\n        # high-confidence committee name from the disclaimer.\n        self.fallback = dspy.Predict(dspy.Signature(\n            \"email_body: str, disclaimer_snippet: str -> committee: str\",\n            \"You are given the plain-text body of a political fundraising email and (possibly) the raw \"\n            \"text that immediately follows the words 'Paid for by' in that email. Name the political \"\n            \"committee (the FEC-registered organization) that paid for the email.\\n\"\n            \"Where to look: the legally required disclaimer, usually near the end, in the form \"\n            \"'Paid for by <COMMITTEE>' \u2014 sometimes followed by 'and not authorized by any candidate or \"\n            \"candidate's committee.' The footer mailing-address block normally repeats the same committee \"\n            \"name right above the street address / PO Box, and sentences like 'Contributions to \"\n            \"<COMMITTEE> are not tax deductible' or 'This message reflects the opinions and \"\n            \"representations of <COMMITTEE>' name it too. Use those repetitions to reconstruct the exact \"\n            \"name when the disclaimer text is mangled.\\n\"\n            \"Rules for the answer:\\n\"\n            \"- Output the committee name only: no 'Paid for by', no 'not authorized by any candidate', no \"\n            \"street address, PO Box, city/state/ZIP, phone number, URL, domain, or unsubscribe text.\\n\"\n            \"- Drop a leading article that is merely grammatical ('Paid for by the ABC' -> 'ABC'). Keep a \"\n            \"capitalized 'The' only when it is clearly part of the registered name.\\n\"\n            \"- Cut any trailing description or apposition that explains the committee rather than naming \"\n            \"it, e.g. text after a comma such as ', a joint fundraising committee authorized by and \"\n            \"composed of ...', ', a project of ...', ', and not authorized by ...'. Keep only the proper \"\n            \"name itself.\\n\"\n            \"- Keep every part of the proper name (e.g. 'for Congress', 'for Senate', 'Victory Fund', \"\n            \"'PAC', 'Republican Party', 'Federal Election Account') when it is part of the name.\\n\"\n            \"- If the disclaimer is in ALL CAPS, convert it to ordinary title case, but leave genuine \"\n            \"acronyms (like PAC or four-letter party-committee acronyms) in capitals.\\n\"\n            \"- If line breaks were stripped and words fused together (a name run into the next word, or \"\n            \"'by' fused to the first word of the name), restore the missing spaces.\\n\"\n            \"- If the name appears twice in a row because the disclaimer and the address block were \"\n            \"concatenated, output it only once.\\n\"\n            \"- Do not answer with a candidate's bare personal name unless that is literally the committee \"\n            \"name.\\n\"\n            \"- Reply with the name only: no quotes, no trailing punctuation, no explanation.\"\n        ))\n\n    def forward(self, **inputs):\n        import re\n\n        body = inputs.get(\"email_body\") or \"\"\n\n        # ---------------- text helpers ----------------\n        def normalize_ws(t):\n            for ch in (\"\\u034f\", \"\\u200b\", \"\\u200c\", \"\\u200d\", \"\\ufeff\", \"\\xa0\", \"\\u00ad\"):\n                t = t.replace(ch, \" \")\n            return re.sub(r\"\\s+\", \" \", t).strip()\n\n        def dewrap(t):\n            \"\"\"Insert a space where line-wrapping fused two words (lowercase then uppercase).\"\"\"\n            prefixes = {\"mc\", \"mac\", \"de\", \"del\", \"della\", \"di\", \"da\", \"la\", \"le\",\n                        \"van\", \"von\", \"du\", \"o\", \"d\", \"st\", \"des\", \"dos\"}\n            out = []\n            for i, ch in enumerate(t):\n                if i > 0 and ch.isupper() and t[i - 1].islower():\n                    j = i - 1\n                    while j >= 0 and (t[j].isalpha() or t[j] == \"'\"):\n                        j -= 1\n                    word = t[j + 1:i]\n                    if word.lower() not in prefixes:\n                        out.append(\" \")\n                out.append(ch)\n            return \"\".join(out)\n\n        def split_fused(tok):\n            \"\"\"Split a token that swallowed the connector 'for' (e.g. NameFor -> Name for).\"\"\"\n            m = re.match(r\"^([A-Z][A-Za-z']{2,})(for|For|FOR)$\", tok)\n            if m:\n                return [m.group(1), m.group(2)]\n            return [tok]\n\n        stop_patterns = [\n            r\"(?i)\\b(?:and\\s+)?(?:is\\s+)?not\\s+authoriz\",\n            r\"(?i)\\bauthorized\\s+by\\b\",\n            r\"(?i)\\bjoint\\s+fundraising\\b\",\n            r\"(?i)\\bjointfundraising\\b\",\n            r\"(?i)\\bcomposed\\s+of\\b\",\n            r\"(?i),\\s*(?:a|an|the)\\s\",\n            r\",\\s+[a-z]\",\n            r\"(?i)\\bnot\\s+paid\\s+for\\b\",\n            r\"(?i)\\bunsubscrib\",\n            r\"(?i)\\bcontribution\",\n            r\"(?i)\\bdonations?\\b\",\n            r\"(?i)\\bp\\.?\\s?o\\.?\\s*box\\b\",\n            r\"(?i)\\ball\\s+rights\\s+reserved\\b\",\n            r\"(?i)\\bcopyright\\b\",\n            r\"(?i)\\btreasurer\\b\",\n            r\"(?i)https?://\",\n            r\"(?i)\\bwww\\.\",\n            r\"(?i)[A-Za-z0-9\\-]+\\.(?:com|org|net|us|io|gov|co)\\b\",\n            r\"(?i)\\bif\\s+you\\b\",\n            r\"(?i)\\byou\\s+are\\b\",\n            r\"(?i)\\bthis\\s+(?:e-?mail|message)\\b\",\n            r\"(?i)\\bfederal\\s+law\\b\",\n            r\"(?i)\\bpaid\\s+for\\s+by\\b\",\n            r\"(?i)\\btext\\s+[A-Z]+\\s+to\\b\",\n            r\"\\d\",\n            r\"\u00a9\",\n            r\"\\|\",\n            r\"\\(\",\n            r\"\\[\",\n        ]\n\n        abbrevs = {\"inc\", \"llc\", \"jr\", \"sr\", \"dr\", \"mr\", \"mrs\", \"ms\", \"st\", \"no\", \"dept\"}\n\n        def first_stop(tail):\n            best = len(tail)\n            for pat in stop_patterns:\n                m = re.search(pat, tail)\n                if m and m.start() < best:\n                    best = m.start()\n            for m in re.finditer(r\"\\.(?=\\s|$)\", tail):\n                w = re.search(r\"[A-Za-z]+$\", tail[:m.start()])\n                if w and len(w.group(0)) >= 3 and w.group(0).lower() not in abbrevs:\n                    if m.start() < best:\n                        best = m.start()\n                    break\n            return best\n\n        def clean(s):\n            s = s.strip()\n            s = s.strip(\"\\\"'\u201c\u201d\u2018\u2019*|-\u2013\u2014\u2022\u00b7:;,. \\t\")\n            s = re.sub(r\"(?i)[\\s,]+(and|the|by|for|of|a|an|to)$\", \"\", s)\n            return normalize_ws(s)\n\n        def keyof(tokens):\n            return re.sub(r\"[^a-z0-9]\", \"\", \"\".join(tokens).lower())\n\n        def dedupe(tokens):\n            \"\"\"Collapse a name repeated twice, preferring the better-spaced copy.\"\"\"\n            n = len(tokens)\n            for i in range(1, n):\n                if keyof(tokens[:i]) and keyof(tokens[:i]) == keyof(tokens[i:]):\n                    a, b = tokens[:i], tokens[i:]\n                    return b if len(b) > len(a) else a\n            for i in range(1, n // 2 + 1):\n                for j in range(i + 1, n + 1):\n                    if keyof(tokens[:i]) and keyof(tokens[:i]) == keyof(tokens[i:j]):\n                        a, b = tokens[:i], tokens[i:j]\n                        return b if len(b) > len(a) else a\n            return tokens\n\n        small_words = {\"for\", \"of\", \"and\", \"the\", \"a\", \"an\", \"to\", \"in\", \"on\", \"at\", \"our\",\n                       \"de\", \"la\", \"y\"}\n        keep_upper = {\"PAC\", \"GOP\", \" {"idx": 9, "score": 0.95, "parents": "7", "role": "Pareto Front", "components": {"self::code": "class IdentifyCommitteeModule(dspy.Module):\n    def __init__(self):\n        super().__init__()\n        # The LM is used ONLY when the deterministic parser cannot recover a\n        # high-confidence committee name from the disclaimer / footer.\n        self.fallback = dspy.Predict(dspy.Signature(\n            \"email_body: str, disclaimer_snippet: str -> committee: str\",\n            \"You are given the plain-text body of a political fundraising email and (possibly) the raw \"\n            \"text that immediately follows the disclaimer phrase in that email. Name the political \"\n            \"committee (the FEC-registered organization) that paid for the email.\\n\"\n            \"Where to look: the legally required disclaimer, usually near the end. It can be phrased \"\n            \"'Paid for by <COMMITTEE>', 'Paid for and provided in kind by <COMMITTEE>', 'Paid political \"\n            \"advertisement paid for by <COMMITTEE>', 'Funded by <COMMITTEE>' or 'Sponsored by \"\n            \"<COMMITTEE>', sometimes followed by 'and not authorized by any candidate or candidate's \"\n            \"committee.' The footer mailing-address block normally repeats the same committee name right \"\n            \"above the street address / PO Box, and sentences like 'Contributions to <COMMITTEE> are not \"\n            \"tax deductible' or 'This message reflects the opinions and representations of <COMMITTEE>' \"\n            \"name it too. Line breaks are often stripped, so the disclaimer may be fused onto unrelated \"\n            \"characters (e.g. a long unsubscribe token) \u2014 the committee name still starts right after \"\n            \"'by'.\\n\"\n            \"Rules for the answer:\\n\"\n            \"- Output the committee name only: no 'Paid for by', no 'not authorized by any candidate', no \"\n            \"street address, PO Box, city/state/ZIP, phone number, URL, do ittee rather than naming \"\n            \"it, e.g. text after a comma such as ', a joint fundraising committee authorized by and \"\n            \"composed of ...', ', a project of ...', ', and not authorized by ...'.\\n\"\n            \"- Keep every part of the proper name (e.g. 'for Congress', 'for Senate', 'for <State>', \"\n            \"'Victory Fund', 'PAC', 'Nonfederal', 'Republican Party', 'Federal Election Account'), \"\n            \"including a two-letter state abbreviation that ends the name (e.g. '... for NH').\\n\"\n            \"- If the disclaimer is in ALL CAPS, convert it to ordinary title case, but leave genuine \"\n            \"acronyms (like PAC or four-letter party-committee acronyms) in capitals.\\n\"\n            \"- If line breaks were stripped and words fused together, restore the missing spaces.\\n\"\n            \"- If the name appears twice in a row because the disclaimer and the address block were \"\n            \"concatenated, output it only once.\\n\"\n            \"- Do not answer with a candidate's bare personal name unless that is literally the committee \"\n            \"name.\\n\"\n            \"- Reply with the name only: no quotes, no trailing punctuation, no explanation.\"\n        ))\n\n    def forward(self, **inputs):\n        import re\n\n        body = inputs.get(\"email_body\") or \"\"\n\n        # ---------------- text helpers ----------------\n        def normalize_ws(t):\n            for ch in (\"\\u034f\", \"\\u200b\", \"\\u200c\", \"\\u200d\", \"\\ufeff\", \"\\xa0\", \"\\u00ad\"):\n                t = t.replace(ch, \" \")\n            return re.sub(r\"\\s+\", \" \", t).strip()\n\n        def dewrap(t):\n            \"\"\"Insert a space where line-wrapping fused two words (lowercase then uppercase).\"\"\"\n            prefixes = {\"mc\", \"mac\", \"de\", \"del\", \"della\", \"di\", \"da\", \"la\", \"le\",\n                        \"van\", \"von\", \"du\", \"o\", \"d\", \"st\", \"des\", \"dos\"}\n            out = [ , \"distributed\", \"prepared\",\n            \"authorized\", \"unauthorized\", \"paid\", \"funded\", \"sponsored\", \"receive\",\n            \"received\", \"because\", \"when\", \"why\", \"how\", \"what\", \"who\", \"treasurer\",\n        }\n\n        def name_run(tokens):\n            \"\"\"Keep the leading run of tokens that can belong to a proper committee name.\"\"\"\n            kept = []\n            pending = []\n            for tok in tokens[:14]:\n                core = tok.strip(\".,'\\\"\u2019\u2018\u201c\u201d-\u2013\u2014:;()[]{}<>#*|\u00bb\u00ab\")\n                if not core:\n                    break\n                if any(c.isdigit() for c in core):\n                    break\n                # junk / placeholder token with no letters at all ends the name\n                if not any(c.isalpha() for c in core) and core not in (\"&\", \"&amp;\"):\n                    break\n                low = core.lower()\n                if low in prose_words:\n                    break\n                if low in connectors:\n                    pending.append(tok)\n                    continue\n                if core[0].isalpha() and core[0].islower():\n                    break\n                # capitalized / acronym token: it anchors any pending connectors\n                kept.extend(pending)\n                pending = []\n                kept.append(tok)\n                # a token that ends a sentence (\"...NH.\" / \"...Committee.\") ends the name\n                if tok.endswith(\".\") and len(core) >= 2 and low not in abbrevs:\n                    break\n            return kept\n\n        def keyof(tokens):\n            return re.sub(r\"[^a-z0-9]\", \"\", \"\".join(tokens).lower())\n\n        def dedupe(tokens):\n            \"\"\"Collapse a name repeated twice, preferring the better-spaced copy.\"\"\"\n            n = len(tokens)\n            for i in range(1, n):\n                if keyof(tokens[:i]) and keyof(tokens[:i]) == keyof(tokens[i:]):\n n(c) > 90:\n                return False\n            if \"@\" in c or \"http\" in c.lower():\n                return False\n            if re.search(r\"\\d{3,}\", c):\n                return False\n            toks = c.split()\n            if not toks or len(toks) > 12:\n                return False\n            if sum(ch.isalpha() for ch in c) < 3:\n                return False\n            if any(len(t.strip(\".,;:\")) > 18 for t in toks):\n                return False\n            if not c[0].isalnum():\n                return False\n            last = toks[-1].strip(\".,;:\").lower()\n            if last in CONNECTORS or last in TRAIL_STOP:\n                return False\n            return True\n\n        # ---- primary source: the legally-required \"Paid for by\" disclaimer ----\n        primary = re.compile(\n            r\"paid\\s*for\\s*(?:and\\s*authorized\\s*)?by|authorized\\s*and\\s*paid\\s*for\\s*by\",\n            re.IGNORECASE,\n        )\n        paid_all = []\n        for m in primary.finditer(body):\n            cand = clean_candidate(body[m.end():])\n            if valid(cand):\n                paid_all.append(cand)\n            if len(paid_all) >= 4:\n                break\n        paid_cand = paid_all[0] if paid_all else \"\"\n        # if a later disclaimer gives a shorter reading that prefixes the first, prefer it\n        for other in paid_all[1:]:\n            a, b = paid_cand.lower(), other.lower()\n            if a.startswith(b) and len(other.split()) >= 2 and len(b) < len(a):\n                paid_cand = other\n\n        # ---- secondary source: the tax-deductibility clause ----\n        contrib_cand = \"\"\n        m = re.search(\n            r\"contributions?(?:\\s+or\\s+gifts?)?\\s*(?:to|made\\s*to)\\s+(.{3,120}?)\\s+are\\s+not\\s+\"\n            r\"(?:tax[\\s-]*)?deduct\",\n            body, re.IGNORECASE,\n        )\n        if m:\n            cand = clean_candidate(m.group(1) + \".\")\n            if valid(cand):\n                contrib_cand = cand\n\n        # ---- tertiary source: the mailing-address block (name right before the address) ----\n        def back_name(prefix_text):\n            \"\"\"Walk backwards from an address to collect the capitalized name in front of it.\"\"\"\n            toks = strip_parens(camel_split(prefix_text)).split()[-16:]\n            picked = []\n            for idx in range(len(toks) - 1, -1, -1):\n                t = toks[idx]\n                core = t.strip(\".,;:()\\\"'*|-\")\n                if not core:\n                    break\n                if \"@\" in t or \"http\" in t.lower() or DOMAIN_RE.search(core):\n                    break\n                if any(c.isdigit() for c in core):\n                    # allow short numerals that are part of the name, not street numbers\n                    if picked and num_ok(t, toks[idx + 1:]):\n                        picked.append(t)\n                        if len(picked) >= 10:\n                            break\n                        continue\n                    break\n                if t.endswith((\",\", \";\", \":\", \"|\", \"!\", \"?\")):\n                    break\n                low = core.lower()\n                if t.endswith(\".\") and low not in ABBREV and len(core) > 1:\n                    break\n                if core[0].isupper() or low in CONNECTORS:\n                    picked.append(t)\n                    if len(picked) >= 10:\n                        break\n                    continue\n                break\n            picked.reverse()\n            for _ in range(4):\n                if picked and picked[0].strip(\".,;:\").lower() in (\"the\", \"by\", \"and\", \"-\"):\n                    picked = picked[1:]\n                    continue\n                break\n            return finish(picked) if picked else \"\"\n\n        addr_re = re.compile(\n            r\"P\\.?\\s*O\\.?\\s*Box\\s*\\d+\"\n            r\"|\\b\\d{2,6}\\s+[A-Z][A-Za-z\\.]*(?:\\s+[A-Z][A-Za-z\\.]*){0,3}\\s+\"\n            r\"(?:St|St\\.|Street|Ave|Ave\\.|Avenue|Rd|Rd\\.|Road|Blvd|Boulevard|Dr|Dr\\.|Drive|Ln|Lane\"\n            r\"|Way|Pkwy|Parkway|Suite|Ste|Circle|Ct|Court|Pl|Place|Hwy|Highway)\\b\",\n            re.IGNORECASE,\n        )\n        addr_cands = []\n        for m in addr_re.finditer(body):\n            c = back_name(body[max(0, m.start() - 300):m.start()])\n            if valid(c) and len(c.split()) >= 2:\n                addr_cands.append(c)\n            if len(addr_cands) >= 5:\n                break\n\n        # ---- reconcile the deterministic readings ----\n        candidate = \"\"\n        if paid_cand:\n            candidate = paid_cand\n            if contrib_cand:\n                a, b = paid_cand.lower(), contrib_cand.lower()\n                if a.startswith(b) and len(contrib_cand.split()) >= 2 and len(b) < len(a):\n                    candidate = contrib_cand\n            low = candidate.lower()\n            for ac in addr_cands:\n                al = ac.lower()\n                if low.startswith(al) and len(al) < len(low):\n                    candidate = ac\n                    low = al\n                    break\n        elif contrib_cand:\n            candidate = contrib_cand\n        elif addr_cands:\n            candidate = addr_cands[0]\n\n        # ---- confidence check: a one-word reading is almost always a truncated name ----\n        def low_confidence(c):\n            toks = c.split()\n            if len(toks) != 1:\n                return False\n            core = toks[0].strip(\".,;:\")\n            # a genuine one-token committee name is an acronym-like all-caps token\n            if core.isupper() and len(core) >= 3:\n                return False\n            return True\n\n        all_cands = []\n        for c in paid_all + ([contrib_cand] if contrib_cand else []) + addr_cands:\n            if valid(c) and c not in all_cands:\n                all_cands.append(c)\n\n        if valid(candidate) and low_confidence(candidate):\n            best = \"\"\n            low = candidate.lower()\n            for c in all_cands:\n                if c.lower().startswith(low) and len(c.split()) > 1 and len(c) > len(best):\n                    best = c\n            if best:\n                candidate = best\n            else:\n                candidate = \"\"  # force LLM fallback rather than a confident wrong guess\n\n        if not valid(candidate):\n            out = self.fallback(email_body=body)\n            candidate = str(getattr(out, \"committee\", \"\") or \"\").strip()\n            candidate = candidate.strip(\" \\\"'`*\")\n            candidate = re.sub(r\"^(?:paid\\s*for\\s*(?:and\\s*authorized\\s*)?by\\s*)\", \"\", candidate,\n                               flags=re.IGNORECASE).strip()\n            candidate = re.sub(r\"^the\\s+\", \"\", candidate).strip()\n            candidate = re.sub(r\"\\s+\", \" \", candidate).strip(\" .,;:\")\n            candidate = \" \".join(dedupe_all(candidate.split()))\n\n        return dspy.Prediction(committee=candidate)"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.54)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.61)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.81)", fillcolor=lightgray, tooltip=" "];
    3 [label="3\\n(0.81)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.81)", fillcolor=lightgray, tooltip=" "];
    5 [label="5\\n(0.94)", fillcolor=lightgray, tooltip=" "];
    6 [label="6\\n(0.94)", fillcolor=lightgray, tooltip=" "];
    7 [label="7\\n(0.95)", fillcolor=cyan, tooltip=" "];
    8 [label="8\\n(0.94)", fillcolor=lightgray, tooltip=" "];
    9 [label="9\\n(0.95)", fillcolor=orange, tooltip=" "];
    10 [label="10\\n(0.94)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    2 -> 4;
    3 -> 5;
    4 -> 6;
    6 -> 7;
    5 -> 8;
    7 -> 9;
    8 -> 10;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
